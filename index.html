<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Schema Designer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f4f3ef; --surface: #fff; --border: #dddbd4; --border-dark: #c5c2b8;
    --text: #1a1917; --text-muted: #6b6860; --text-faint: #a09e98;
    --accent: #1a1917; --accent-fg: #f4f3ef;
    --blue: #1e4fd8; --blue-bg: #eef2fd; --blue-border: #b3c3f5;
    --green: #1a7a3f; --green-bg: #eaf5ee; --green-border: #a3d4b3;
    --amber: #92500a; --amber-bg: #fdf3e3; --amber-border: #f0c87a;
    --red: #b91c1c; --red-bg: #fef2f2; --red-border: #fca5a5;
    --purple: #5b21b6; --purple-bg: #f3f0fe; --purple-border: #c4b5fd;
    --pink: #9d174d; --pink-bg: #fdf2f8; --pink-border: #f9a8d4;
    --gray-bg: #f1f0eb; --gray-border: #d1cfc6;
    --radius: 6px; --radius-lg: 10px;
  }
  body { font-family: 'Sora', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .header { background: var(--accent); color: var(--accent-fg); padding: 14px 24px; display: flex; align-items: center; gap: 16px; }
  .header-logo { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; opacity: 0.5; }
  .header-title { font-size: 14px; font-weight: 600; }
  .header-sep { flex: 1; }
  .header-tag { font-family: 'IBM Plex Mono', monospace; font-size: 10px; opacity: 0.4; letter-spacing: 0.06em; }
  .main { max-width: 980px; margin: 0 auto; padding: 28px 20px 60px; }
  .meta-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .meta-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text-faint); letter-spacing: 0.08em; text-transform: uppercase; }
  .table-name-input { font-family: 'Sora', sans-serif; font-size: 20px; font-weight: 600; border: none; border-bottom: 2px solid var(--border-dark); background: transparent; color: var(--text); padding: 4px 2px 6px; width: 240px; outline: none; transition: border-color 0.15s; }
  .table-name-input:focus { border-color: var(--accent); }
  .col-badge { font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 3px 10px; border-radius: 20px; background: var(--gray-bg); color: var(--text-muted); border: 1px solid var(--gray-border); }
  .toolbar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .toolbar-left { display: flex; gap: 8px; flex: 1; flex-wrap: wrap; }
  .toolbar-right { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 7px; font-family: 'Sora', sans-serif; font-size: 12px; font-weight: 500; padding: 8px 14px; border-radius: var(--radius); border: 1.5px solid var(--border-dark); background: var(--surface); color: var(--text); cursor: pointer; transition: background 0.12s, border-color 0.12s, transform 0.08s; white-space: nowrap; }
  .btn:hover { background: var(--bg); border-color: var(--accent); }
  .btn:active { transform: scale(0.97); }
  .btn svg { width: 14px; height: 14px; flex-shrink: 0; }
  .btn-green { border-color: var(--green-border); background: var(--green-bg); color: var(--green); }
  .btn-green:hover { background: #d4edda; border-color: var(--green); }
  .btn-amber { border-color: var(--amber-border); background: var(--amber-bg); color: var(--amber); }
  .btn-amber:hover { background: #fde8b8; border-color: var(--amber); }
  .btn-blue { border-color: var(--blue-border); background: var(--blue-bg); color: var(--blue); }
  .btn-blue:hover { background: #dce6fc; border-color: var(--blue); }

  /* vis bar */
  .vis-bar { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-lg); padding: 12px 16px; margin-bottom: 14px; display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  .vis-group { display: flex; flex-direction: column; gap: 7px; flex: 1; min-width: 180px; }
  .vis-group-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-faint); display: flex; align-items: center; gap: 5px; }
  .vis-group-label svg { width: 11px; height: 11px; }
  .vis-pills { display: flex; flex-wrap: wrap; gap: 5px; }
  .vpill { display: inline-flex; align-items: center; gap: 5px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 4px 10px; border-radius: 20px; cursor: pointer; border: 1.5px solid var(--border); background: var(--gray-bg); color: var(--text-muted); user-select: none; transition: all 0.12s; }
  .vpill.on  { background: var(--green-bg);  border-color: var(--green-border); color: var(--green); }
  .vpill.off { background: var(--gray-bg);   border-color: var(--gray-border);  color: var(--text-faint); text-decoration: line-through; opacity: 0.7; }
  .vpill-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .vis-divider { width: 1px; background: var(--border); align-self: stretch; flex-shrink: 0; }
  .vis-reset { font-family: 'Sora', sans-serif; font-size: 11px; border: 1.5px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--text-muted); padding: 4px 10px; cursor: pointer; align-self: flex-end; white-space: nowrap; margin-bottom: 2px; }
  .vis-reset:hover { background: var(--border-dark); color: var(--text); }

  /* schema card */
  .schema-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
  table.st { width: 100%; border-collapse: collapse; }
  table.st th { background: #faf9f6; font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-faint); padding: 10px 12px; text-align: left; border-bottom: 1.5px solid var(--border); white-space: nowrap; }
  table.st td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.st tbody tr:last-child td { border-bottom: none; }
  table.st tbody tr:not(.row-hidden):hover td { background: #faf9f6; }
  table.st tbody tr.row-hidden td { opacity: 0.25; background: var(--gray-bg) !important; }

  /* inputs */
  .col-input, .type-select { width: 100%; font-family: 'Sora', sans-serif; font-size: 13px; border: 1.5px solid transparent; border-radius: var(--radius); padding: 6px 8px; background: transparent; color: var(--text); outline: none; transition: border-color 0.12s, background 0.12s; }
  .col-input:hover, .type-select:hover { border-color: var(--border); background: var(--bg); }
  .col-input:focus, .type-select:focus { border-color: var(--accent); background: var(--surface); }
  .type-select { cursor: pointer; }

  /* pk btn */
  .pk-btn { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--border); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-faint); transition: all 0.12s; margin: auto; }
  .pk-btn:hover { border-color: var(--amber-border); color: var(--amber); }
  .pk-btn.active { background: var(--amber-bg); border-color: var(--amber-border); color: var(--amber); }
  .pk-btn svg { width: 12px; height: 12px; }

  /* nn */
  .nn-wrap { display: flex; justify-content: center; padding-top: 8px; }
  input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--blue); cursor: pointer; }

  /* icon btns */
  .icon-btn { width: 26px; height: 26px; border: 1.5px solid var(--border); border-radius: var(--radius); background: var(--gray-bg); cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-faint); transition: all 0.12s; margin: 2px auto 0; flex-shrink: 0; }
  .icon-btn:hover { border-color: var(--blue-border); color: var(--blue); background: var(--blue-bg); }
  .icon-btn.off { background: var(--gray-bg); border-color: var(--gray-border); color: var(--text-faint); }
  .icon-btn svg { width: 12px; height: 12px; }
  .del-btn { width: 26px; height: 26px; border: none; background: none; border-radius: var(--radius); cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-faint); transition: all 0.12s; margin-top: 2px; }
  .del-btn:hover { background: var(--red-bg); color: var(--red); }
  .del-btn svg { width: 13px; height: 13px; }

  /* enum */
  .enum-area { padding-top: 2px; }
  .enum-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
  .etag { display: inline-flex; align-items: center; gap: 4px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 20px; border: 1px solid var(--gray-border); background: var(--gray-bg); color: var(--text-muted); }
  .etag.active { background: var(--purple-bg); color: var(--purple); border-color: var(--purple-border); }
  .etag.inactive { background: var(--gray-bg); color: var(--text-muted); border-color: var(--gray-border); }
  .etag.invisible { background: var(--pink-bg); color: var(--pink); border-color: var(--pink-border); }
  .etag-del { background: none; border: none; cursor: pointer; font-size: 11px; color: inherit; opacity: 0.5; padding: 0; line-height: 1; }
  .etag-del:hover { opacity: 1; }
  .enum-add-row { display: flex; gap: 6px; }
  .enum-input { flex: 1; min-width: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; border: 1.5px solid var(--border); border-radius: var(--radius); padding: 5px 8px; background: var(--bg); color: var(--text); outline: none; }
  .enum-input:focus { border-color: var(--accent); background: var(--surface); }
  .enum-add-btn { font-family: 'Sora', sans-serif; font-size: 12px; border: 1.5px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--text-muted); padding: 5px 10px; cursor: pointer; }
  .enum-add-btn:hover { background: var(--border); color: var(--text); }
  .empty-detail { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-faint); padding-top: 7px; display: inline-block; }

  .add-row-btn { width: 100%; border: none; background: #faf9f6; border-top: 1px dashed var(--border-dark); color: var(--text-muted); font-family: 'Sora', sans-serif; font-size: 13px; padding: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.12s, color 0.12s; }
  .add-row-btn:hover { background: var(--bg); color: var(--text); }
  .add-row-btn svg { width: 14px; height: 14px; }

  .toast { display: none; margin-top: 14px; padding: 10px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 500; animation: fadeIn 0.2s ease; }
  .toast.ok  { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
  .toast.err { background: var(--red-bg);   color: var(--red);   border: 1px solid var(--red-border); }
  @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; } }

  .sql-section { margin-top: 24px; }
  .sql-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 8px; }
  .sql-box { background: #1a1917; color: #e8e6df; font-family: 'IBM Plex Mono', monospace; font-size: 13px; line-height: 1.8; padding: 18px 20px; border-radius: var(--radius-lg); white-space: pre-wrap; overflow-x: auto; }
  .sql-kw { color: #7dd3fc; } .sql-type { color: #86efac; } .sql-col { color: #f9a8d4; }

  @media print {
    body { background: #fff; }
    .no-print { display: none !important; }
    .print-only { display: block !important; }
    .main { max-width: 100%; padding: 20px; }
    .schema-card { border: 1px solid #ccc; }
    table.st th { background: #f5f5f5; }
    tr.print-exclude { display: none !important; }
    td.col-hide, th.col-hide { display: none !important; }
  }
  .print-only { display: none; }
</style>
</head>
<body>

<header class="header no-print">
  <span class="header-logo">DB /</span>
  <span class="header-title">Schema Designer</span>
  <span class="header-sep"></span>
  <span class="header-tag">OFFLINE TOOL</span>
</header>

<div class="main">
  <div class="print-only" style="margin-bottom:24px">
    <h1 style="font-size:22px;font-weight:700;margin-bottom:4px" id="print-title">Schema</h1>
    <p style="font-size:13px;color:#666" id="print-meta"></p>
    <hr style="margin-top:12px;border:none;border-top:2px solid #1a1917"/>
  </div>

  <div class="meta-row no-print">
    <span class="meta-label">Table</span>
    <input class="table-name-input" id="tableName" placeholder="table_name" value="users" />
    <span class="col-badge" id="colCount">4 columns</span>
  </div>

  <div class="toolbar no-print">
    <div class="toolbar-left">
      <label class="btn btn-blue" style="cursor:pointer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Load JSON
        <input type="file" accept=".json" id="fileInput" style="display:none"/>
      </label>
    </div>
    <div class="toolbar-right">
      <button class="btn btn-amber" id="saveBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Save JSON
      </button>
      <button class="btn btn-green" id="pdfBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        Export PDF
      </button>
      <button class="btn" id="sqlBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        Preview SQL
      </button>
    </div>
  </div>

  <!-- Visibility bar -->
  <div class="vis-bar no-print">
    <div class="vis-group">
      <div class="vis-group-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
        Hide / show columns
      </div>
      <div class="vis-pills" id="colPills"></div>
    </div>
    <div class="vis-divider"></div>
    <div class="vis-group">
      <div class="vis-group-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/></svg>
        Hide / show rows
      </div>
      <div class="vis-pills" id="rowPills"></div>
    </div>
    <button class="vis-reset" id="resetVisBtn">Reset all</button>
  </div>

  <div class="schema-card">
    <table class="st">
      <thead id="schemaHead"></thead>
      <tbody id="schemaBody"></tbody>
    </table>
    <button class="add-row-btn no-print" id="addRowBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add column
    </button>
  </div>

  <div class="toast" id="toast"></div>
  <div class="sql-section" id="sqlSection" style="display:none">
    <div class="sql-label">Generated SQL</div>
    <div class="sql-box" id="sqlBox"></div>
  </div>
</div>

<script>
const TYPES = ['INT','BIGINT','SMALLINT','VARCHAR','TEXT','CHAR','DATE','DATETIME','TIMESTAMP','BOOLEAN','DECIMAL','FLOAT','DOUBLE','UUID','JSON','BLOB','ENUM'];
const ETAG_MAP = { active:'active', inactive:'inactive', invisible:'invisible' };

// hideable table columns (key matches colVis object)
const TCOLS = [
  { key:'pk',      label:'PK',              hideable:true  },
  { key:'name',    label:'Column name',     hideable:true  },
  { key:'type',    label:'Data type',       hideable:true  },
  { key:'details', label:'Values/details',  hideable:true  },
  { key:'nn',      label:'Not null',        hideable:true  },
];

let colVis = { pk:true, name:true, type:true, details:true, nn:true };

let rows = [
  { name:'id',         type:'INT',       pk:true,  nn:true,  enumVals:[], rowVis:true },
  { name:'name',       type:'VARCHAR',   pk:false, nn:true,  enumVals:[], rowVis:true },
  { name:'status',     type:'ENUM',      pk:false, nn:true,  enumVals:['active','inactive','invisible'], rowVis:true },
  { name:'created_at', type:'TIMESTAMP', pk:false, nn:false, enumVals:[], rowVis:true },
];

// Track the newly added row index so we can focus it without re-render stealing focus
let pendingFocusIdx = null;

function etagClass(v){ return ETAG_MAP[v.toLowerCase()]||''; }

function syncBadge(){
  const vis = rows.filter(r=>r.rowVis!==false).length;
  document.getElementById('colCount').textContent =
    vis===rows.length ? rows.length+' column'+(rows.length!==1?'s':'')
    : vis+'/'+rows.length+' rows visible';
}

function toast(msg,type){
  const el=document.getElementById('toast');
  el.textContent=msg; el.className='toast '+(type||'ok'); el.style.display='block';
  clearTimeout(el._t); el._t=setTimeout(()=>{el.style.display='none';},3200);
}

const eyeOn  = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
const eyeOff = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;

function cs(key){ return colVis[key]===false ? 'display:none' : ''; }
function cc(key){ return colVis[key]===false ? 'col-hide' : ''; }

function renderHead(){
  const head = document.getElementById('schemaHead');
  head.innerHTML = '';
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <th style="width:42px;text-align:center;${cs('pk')}" class="${cc('pk')}">PK</th>
    <th style="width:22%;${cs('name')}" class="${cc('name')}">Column name</th>
    <th style="width:15%;${cs('type')}" class="${cc('type')}">Data type</th>
    <th style="${cs('details')}" class="${cc('details')}">Values / details</th>
    <th style="width:66px;text-align:center;${cs('nn')}" class="${cc('nn')}">Not null</th>
    <th style="width:34px" class="no-print"></th>
    <th style="width:32px" class="no-print"></th>
  `;
  head.appendChild(tr);
}

function renderBody(){
  const body = document.getElementById('schemaBody');
  body.innerHTML = '';
  rows.forEach((r,i) => {
    const isEnum = r.type==='ENUM';
    const hidden = r.rowVis===false;
    const tr = document.createElement('tr');
    if(hidden){ tr.classList.add('row-hidden'); tr.classList.add('print-exclude'); }

    const tagsHtml = isEnum ? r.enumVals.map((v,vi)=>
      `<span class="etag ${etagClass(v)}">${v}<button class="etag-del" data-i="${i}" data-vi="${vi}">✕</button></span>`
    ).join('') : '';

    const detailHtml = isEnum
      ? `<div class="enum-area"><div class="enum-tags">${tagsHtml}</div>
          <div class="enum-add-row no-print">
            <input class="enum-input" data-i="${i}" placeholder="Add value…"/>
            <button class="enum-add-btn" data-i="${i}">+ Add</button>
          </div></div>`
      : `<span class="empty-detail">—</span>`;

    tr.innerHTML = `
      <td style="text-align:center;padding-top:10px;${cs('pk')}" class="${cc('pk')}">
        <button class="pk-btn ${r.pk?'active':''}" data-pk="${i}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="15" r="4"/><line x1="11" y1="12" x2="21" y2="2"/><line x1="18" y1="5" x2="21" y2="2"/><line x1="15" y1="8" x2="17" y2="6"/></svg>
        </button>
      </td>
      <td style="${cs('name')}" class="${cc('name')}">
        <input class="col-input" data-name="${i}" value="${r.name}" placeholder="column_name"/>
      </td>
      <td style="${cs('type')}" class="${cc('type')}">
        <select class="type-select" data-type="${i}">
          ${TYPES.map(t=>`<option value="${t}"${r.type===t?' selected':''}>${t}</option>`).join('')}
        </select>
      </td>
      <td style="${cs('details')}" class="${cc('details')}">${detailHtml}</td>
      <td style="text-align:center;${cs('nn')}" class="${cc('nn')}">
        <div class="nn-wrap"><input type="checkbox" data-nn="${i}" ${r.nn?'checked':''}/></div>
      </td>
      <td class="no-print" style="padding-top:8px;text-align:center">
        <button class="icon-btn ${hidden?'off':''}" data-roweye="${i}" title="${hidden?'Show row':'Hide row'}">
          ${hidden?eyeOff:eyeOn}
        </button>
      </td>
      <td class="no-print" style="padding-top:8px">
        <button class="del-btn" data-del="${i}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        </button>
      </td>
    `;
    body.appendChild(tr);
  });
}

function renderPills(){
  const cp = document.getElementById('colPills');
  cp.innerHTML='';
  TCOLS.filter(c=>c.hideable).forEach(c=>{
    const on = colVis[c.key]!==false;
    const p = document.createElement('span');
    p.className='vpill '+(on?'on':'off');
    p.innerHTML=`<span class="vpill-dot"></span>${c.label}`;
    p.onclick=()=>{ colVis[c.key]=!on; renderHead(); renderBody(); renderPills(); syncBadge(); };
    cp.appendChild(p);
  });

  const rp = document.getElementById('rowPills');
  rp.innerHTML='';
  rows.forEach((r,i)=>{
    const label=r.name||('row '+(i+1));
    const on=r.rowVis!==false;
    const p=document.createElement('span');
    p.className='vpill '+(on?'on':'off');
    p.innerHTML=`<span class="vpill-dot"></span>${label}`;
    p.onclick=()=>{ rows[i].rowVis=!on; renderBody(); renderPills(); syncBadge(); };
    rp.appendChild(p);
  });
}

function render(skipFocus){
  renderHead();
  renderBody();
  renderPills();
  syncBadge();
  if(!skipFocus && pendingFocusIdx!==null){
    const inp = document.querySelector(`.col-input[data-name="${pendingFocusIdx}"]`);
    if(inp){ inp.focus(); inp.select(); }
    pendingFocusIdx=null;
  }
}

/* ── Event delegation on tbody ── */
document.getElementById('schemaBody').addEventListener('click', e=>{
  const pk  = e.target.closest('[data-pk]');
  const del = e.target.closest('[data-del]');
  const etD = e.target.closest('.etag-del');
  const eA  = e.target.closest('.enum-add-btn');
  const eye = e.target.closest('[data-roweye]');
  if(pk){
    e.preventDefault();
    const i=+pk.dataset.pk; rows[i].pk=!rows[i].pk; if(rows[i].pk) rows[i].nn=true;
    renderBody(); renderPills(); updateSQL();
  } else if(del){
    const i=+del.dataset.del; if(rows.length>1){ rows.splice(i,1); render(true); }
  } else if(etD){
    const i=+etD.dataset.i, vi=+etD.dataset.vi; rows[i].enumVals.splice(vi,1);
    renderBody(); updateSQL();
  } else if(eA){
    addEnumVal(+eA.dataset.i);
  } else if(eye){
    const i=+eye.dataset.roweye; rows[i].rowVis=!rows[i].rowVis;
    renderBody(); renderPills(); syncBadge();
  }
});

/* ── Listen for changes WITHOUT re-rendering (fixes focus bug) ── */
document.getElementById('schemaBody').addEventListener('change', e=>{
  const n  = e.target.closest('[data-name]');
  const t  = e.target.closest('[data-type]');
  const nn = e.target.closest('[data-nn]');
  if(n)  rows[+n.dataset.name].name = e.target.value;
  else if(t){ rows[+t.dataset.type].type=e.target.value; renderBody(); renderPills(); }
  else if(nn) rows[+nn.dataset.nn].nn=e.target.checked;
  updateSQL();
});

/* Key fix: on input just update data model, update pills lazily, DON'T re-render the whole table */
document.getElementById('schemaBody').addEventListener('input', e=>{
  const n = e.target.closest('[data-name]');
  if(n){
    rows[+n.dataset.name].name = e.target.value;
    // debounce pill update so typing isn't interrupted
    clearTimeout(document._pillTimer);
    document._pillTimer = setTimeout(()=>{ renderPills(); syncBadge(); }, 300);
    updateSQL();
  }
});

document.getElementById('schemaBody').addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    const inp=e.target.closest('.enum-input');
    if(inp){ e.preventDefault(); addEnumVal(+inp.dataset.i); }
  }
});

function addEnumVal(i){
  const inp=document.querySelector(`.enum-input[data-i="${i}"]`); if(!inp) return;
  const val=inp.value.trim(); if(!val||rows[i].enumVals.includes(val)) return;
  rows[i].enumVals.push(val); renderBody(); updateSQL();
  setTimeout(()=>{ const ni=document.querySelector(`.enum-input[data-i="${i}"]`); if(ni) ni.focus(); },30);
}

document.getElementById('addRowBtn').onclick = ()=>{
  rows.push({name:'',type:'VARCHAR',pk:false,nn:false,enumVals:[],rowVis:true});
  pendingFocusIdx = rows.length-1;
  render();
};

document.getElementById('tableName').addEventListener('input', updateSQL);

document.getElementById('resetVisBtn').onclick = ()=>{
  colVis={pk:true,name:true,type:true,details:true,nn:true};
  rows.forEach(r=>r.rowVis=true);
  render(true); toast('✓ All visibility reset.');
};

/* Save JSON */
document.getElementById('saveBtn').onclick = ()=>{
  try{
    const tName=document.getElementById('tableName').value.trim()||'my_table';
    const blob=new Blob([JSON.stringify({tableName:tName,savedAt:new Date().toISOString(),colVis,columns:rows},null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=tName+'_schema.json'; a.click();
    toast('✓ JSON saved!');
  }catch(e){ toast('Save failed: '+e.message,'err'); }
};

/* Load JSON */
document.getElementById('fileInput').onchange = e=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(!Array.isArray(data.columns)) throw new Error('Invalid format');
      document.getElementById('tableName').value=data.tableName||'';
      if(data.colVis) colVis={...colVis,...data.colVis};
      rows=data.columns.map(c=>({name:c.name||'',type:c.type||'VARCHAR',pk:!!c.pk,nn:!!c.nn,enumVals:Array.isArray(c.enumVals)?c.enumVals:[],rowVis:c.rowVis!==false}));
      render(true); updateSQL(); toast('✓ Schema loaded!');
    }catch(err){ toast('Load failed: '+err.message,'err'); }
  };
  reader.readAsText(file); e.target.value='';
};

/* Export PDF */
document.getElementById('pdfBtn').onclick = ()=>{
  const tName=document.getElementById('tableName').value.trim()||'my_table';
  const visRows=rows.filter(r=>r.rowVis!==false).length;
  const hidRows=rows.length-visRows;
  const hidCols=Object.values(colVis).filter(v=>v===false).length;
  const date=new Date().toLocaleDateString('en-IN',{year:'numeric',month:'long',day:'numeric'});
  document.getElementById('print-title').textContent=tName;
  document.getElementById('print-meta').textContent=
    visRows+' row'+(visRows!==1?'s':'')+' exported'
    +(hidRows>0?' · '+hidRows+' hidden':'')
    +(hidCols>0?' · '+hidCols+' col'+(hidCols!==1?'s':'')+' hidden':'')
    +'  ·  '+date;
  window.print();
  toast('✓ Print dialog opened.');
};

function typeStr(r){ if(r.type==='ENUM'&&r.enumVals.length) return `ENUM('${r.enumVals.join("','")}')`;return r.type; }
function updateSQL(){ const s=document.getElementById('sqlSection'); if(s.style.display==='none') return; buildSQL(); }
function buildSQL(){
  const tName=document.getElementById('tableName').value.trim()||'my_table';
  const lines=rows.map(r=>{
    const col=r.name||'column', type=typeStr(r);
    let line=`  <span class="sql-col">${col}</span> <span class="sql-type">${type}</span>`;
    if(r.pk) line+=` <span class="sql-kw">PRIMARY KEY</span>`;
    else if(r.nn) line+=` <span class="sql-kw">NOT NULL</span>`;
    return line;
  });
  document.getElementById('sqlBox').innerHTML=`<span class="sql-kw">CREATE TABLE</span> ${tName} (\n`+lines.join(',\n')+`\n);`;
}
document.getElementById('sqlBtn').onclick = ()=>{
  const sec=document.getElementById('sqlSection');
  if(sec.style.display==='none'){buildSQL();sec.style.display='block';document.getElementById('sqlBtn').textContent='Hide SQL';}
  else{sec.style.display='none';document.getElementById('sqlBtn').innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg> Preview SQL`;}
};

render(true);
</script>
</body>
</html>
